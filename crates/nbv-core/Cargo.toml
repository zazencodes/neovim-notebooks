[package]
name = "nbv-core"
description = "Neovim Notebooks core: lossless notebook model, projection, reconciliation, persistence, kernel state"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rand = "0.9"
sha2 = "0.10"
tempfile = "3"
jupyter-zmq-client = { version = "1", features = ["tokio-runtime"] }
jupyter-protocol = "2"
tokio = { version = "1", features = ["full"] }
libc = "0.2.189"

[dev-dependencies]
proptest = "1"
serde_json.workspace = true
