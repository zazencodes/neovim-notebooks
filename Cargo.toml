[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/zazencodes/neovim-notebooks"

[workspace.dependencies]
nbv-core = { path = "crates/nbv-core" }
nbv-nvim = { path = "crates/nbv-nvim" }
nbv-tui = { path = "crates/nbv-tui" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
